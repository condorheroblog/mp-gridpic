    <script>
      // 防止明暗主题切换闪烁:在首帧绘制前同步主题
      (function () {
        try {
          var raw = localStorage.getItem("mp-gridpic-theme");
          var stored = raw ? JSON.parse(raw) : null;
          var theme =
            (stored && stored.state && stored.state.mode) ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light");
          if (theme === "dark") document.documentElement.classList.add("dark");
        } catch (error) {
          /* 忽略存储异常 */
        }
      })();
    </script>
