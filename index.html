<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/pwa-192x192.png" />
    <meta name="theme-color" content="#6366f1" />
    <meta
      name="description"
      content="一款专为微信公众号打造的纯图片版式排版工具，支持单图、双图、网格、上下/左右滑动等多种版式，一键复制即可粘贴到公众号编辑器。"
    />
    <title>公众号图片排版 · mp-gridpic</title>
    <script>
      // 防止明暗主题切换闪烁:在首帧绘制前同步主题
      (function () {
        try {
          var raw = localStorage.getItem("mp-gridpic-theme");
          var stored = raw ? JSON.parse(raw) : null;
          var theme =
            (stored && stored.state && stored.state.mode) ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light");
          if (theme === "dark") document.documentElement.classList.add("dark");
        } catch (error) {
          /* 忽略存储异常 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
